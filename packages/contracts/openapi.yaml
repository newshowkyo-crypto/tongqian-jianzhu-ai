openapi: 3.1.0
info:
  title: Tongqian Jianzhu AI API
  version: 0.1.0
  description: Shared OpenAPI contract for the Tongqian Jianzhu AI platform.
  license:
    name: Proprietary
    url: https://tongqian.local/license
servers:
  - url: /api/v1
    description: Default API base path
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Service health endpoints.
  - name: Owner Risk Radar
    description: Owner risk assessment and analysis endpoints.
  - name: Market Situation Radar
    description: Market signal monitoring and analysis endpoints.
paths:
  /health:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Check API health
      security: []
      responses:
        '200':
          description: API service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '4XX':
          description: Request failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /owner-risk/profiles:
    get:
      tags:
        - Owner Risk Radar
      operationId: listOwnerRiskProfiles
      summary: List owner risk profiles
      parameters:
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of owner risk profiles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerRiskProfileListResponse'
        '4XX':
          description: Request failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Owner Risk Radar
      operationId: createOwnerRiskProfile
      summary: Create a new owner risk profile
      parameters:
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
        - name: x-user-id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOwnerRiskProfileRequest'
      responses:
        '200':
          description: Owner risk profile created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerRiskProfileResponse'
        '4XX':
          description: Request failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /owner-risk/profiles/{profileId}:
    get:
      tags:
        - Owner Risk Radar
      operationId: getOwnerRiskProfile
      summary: Get owner risk profile by ID
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
