components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - data
        - message
        - traceId
      properties:
        code:
          type: string
          example: OK
        data:
          type: object
          additionalProperties: false
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - ok
        message:
          type: string
          example: success
        traceId:
          type: string
          example: trace_01JZ0000000000000000000000
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - data
        - message
        - traceId
      properties:
        code:
          type: string
          example: BAD_REQUEST
        data:
          type: 'null'
        message:
          type: string
          example: Request failed
        traceId:
          type: string
          example: trace_01JZ0000000000000000000000

    CreateOwnerRiskProfileRequest:
      type: object
      additionalProperties: false
      required:
        - ownerName
      properties:
        ownerName:
          type: string
        idCardMasked:
          type: string
        creditCode:
          type: string

    OwnerRiskProfileView:
      type: object
      additionalProperties: false
      required:
        - id
        - tenantId
        - userId
        - ownerName
        - overallRiskLevel
        - riskScore
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        tenantId:
          type: string
        userId:
          type: string
        ownerName:
          type: string
        idCardMasked:
          type: string
        creditCode:
          type: string
        overallRiskLevel:
          type: string
          enum:
            - low
            - medium
            - high
            - critical
        guaranteeRiskLevel:
          type: string
          enum:
            - low
            - medium
            - high
            - critical
        mixingRiskLevel:
          type: string
          enum:
            - low
            - medium
            - high
            - critical
