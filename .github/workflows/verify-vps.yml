name: Verify VPS Connection

# 仅手动触发（验证 GitHub Secrets + VPS SSH 连通性）
on:
  workflow_dispatch:

jobs:
  verify-vps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify required secrets presence
        run: |
          echo "Checking secrets presence..."
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "::error::VPS_HOST is empty"
            exit 1
          else
            echo "VPS_HOST length=$(echo -n '${{ secrets.VPS_HOST }}' | wc -c)"
          fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then
            echo "::error::VPS_USER is empty"
            exit 1
          else
            echo "VPS_USER=${{ secrets.VPS_USER }}"
          fi
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "::error::VPS_SSH_KEY is empty"
            exit 1
          else
            echo "VPS_SSH_KEY length=$(echo -n '${{ secrets.VPS_SSH_KEY }}' | wc -c)"
          fi
          if [ -z "${{ secrets.DEPLOY_PATH }}" ]; then
            echo "::error::DEPLOY_PATH is empty"
            exit 1
          else
            echo "DEPLOY_PATH=${{ secrets.DEPLOY_PATH }}"
          fi

      - name: Test SSH connection (appleboy/ssh-action - ed25519 friendly)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 60s
          script: |
            echo "===== VPS SSH OK ====="
            echo "Hostname: $(hostname)"
            echo "Date: $(date)"
            echo "User: $(whoami)"
            echo "Pwd: $(pwd)"
            echo "Deploy path: ${{ secrets.DEPLOY_PATH }}"
            test -d ${{ secrets.DEPLOY_PATH }} && echo "Deploy path exists: YES" || echo "Deploy path exists: NO"
            echo "Docker: $(docker --version 2>&1 | head -1)"
            echo "Docker Compose: $(docker compose version 2>&1 | head -1)"
            echo "Node: $(node -v 2>&1)"
            echo "pnpm: $(pnpm -v 2>&1)"
            echo "Disk: $(df -h / | tail -1)"
            echo "Memory: $(free -h | head -2 | tail -1)"
            echo "Swap: $(free -h | grep Swap)"
            echo "===== ALL OK ====="

      - name: Test deploy path write permission
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            TS=$(date +%s)
            touch .verify-write-test-$TS
            ls -la .verify-write-test-* 2>&1 | head -3
            rm -f .verify-write-test-*
            echo "Write permission OK"

      - name: Final summary
        run: |
          echo "===== VERIFICATION PASSED ====="
          echo ""
          echo "GitHub Actions can now deploy to your VPS."
