[package]
name = "tongqian-jianzhu-desktop"
version = "0.1.0"
description = "Tongqian desktop shell"
authors = ["Tongqian"]
edition = "2021"
rust-version = "1.77"
license = "UNLICENSED"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"

[package.metadata.tongqian]
updater_signature = "minisign"
signing_key = "TAURI_UPDATER_PRIVATE_KEY"
