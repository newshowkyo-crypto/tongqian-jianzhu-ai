[package]
name = "tongqian_desktop"
version = "0.1.0"
description = "Tongqian desktop shell"
authors = ["Tongqian"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
