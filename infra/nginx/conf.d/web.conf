server {
  listen 80;
  server_name web.localhost www.tongqian.local www.tongqian.xin tongqian.xin;

  location /.well-known/acme-challenge/ {
    root /usr/share/nginx/html;
  }

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name www.tongqian.xin tongqian.xin;

  ssl_certificate /etc/letsencrypt/live/tongqian.xin/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tongqian.xin/privkey.pem;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location /api/ {
    resolver 127.0.0.11 valid=30s;
    set $upstream api:4000;
    proxy_pass http://$upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = / {
    root /usr/share/nginx/html;
    add_header Cache-Control 'no-store, must-revalidate';
    try_files /index.html =404;
  }

  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control 'no-store, must-revalidate';
    try_files /index.html =404;
  }

  location = /login {
    return 302 /Boss/login$is_args$args;
  }

  location = /login.html {
    return 302 /Boss/login$is_args$args;
  }

  location = /Boss {
    return 301 /Boss/;
  }

  location ^~ /Boss/ {
    resolver 127.0.0.11 valid=30s;
    set $upstream web:3000;
    proxy_pass http://$upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /admin {
    return 302 /Boss/login?role=admin&next=/admin/dashboard;
  }

  location = /admin/ {
    return 302 /Boss/login?role=admin&next=/admin/dashboard;
  }

  location = /admin/login {
    return 302 /Boss/login?role=admin&next=/admin/dashboard;
  }

  location ^~ /admin/ {
    resolver 127.0.0.11 valid=30s;
    set $upstream admin:3000;
    proxy_pass http://$upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /agent {
    return 302 /Boss/login?role=agent&next=/agent/dashboard;
  }

  location = /agent/ {
    return 302 /Boss/login?role=agent&next=/agent/dashboard;
  }

  location = /agent/login {
    return 302 /Boss/login?role=agent&next=/agent/dashboard;
  }

  location ^~ /agent/ {
    resolver 127.0.0.11 valid=30s;
    set $upstream agent:3000;
    proxy_pass http://$upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /gov {
    return 302 /Boss/login?role=gov&next=/gov/dashboard;
  }

  location = /gov/ {
    return 302 /Boss/login?role=gov&next=/gov/dashboard;
  }

  location = /gov/login {
    return 302 /Boss/login?role=gov&next=/gov/dashboard;
  }

  location ^~ /gov/ {
    resolver 127.0.0.11 valid=30s;
    set $upstream gov:3000;
    proxy_pass http://$upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    return 404;
  }
}
